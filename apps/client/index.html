<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌳</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Chunky display face for the logo and menu buttons; falls back to the system font offline.
         Loaded without blocking the first paint, so the splash below shows at once on slow connections. -->
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <title>PlayGround</title>
    <!-- Splash until the app's JS runs (dev serves hundreds of unbundled modules, slow on a phone); React then
         replaces it with the real loading screen (ui/home/LoadingScreen.tsx), which looks the same. -->
    <style>
      html, body { margin: 0; height: 100%; background: #0a1430; }
      .splash {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: linear-gradient(to bottom, #0a1430 0%, #25375e 62%, #f2a77a 100%);
        color: #f0d6b8; font: 0.85em system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .splash p { margin: 0; }
      .splash-icon { font-size: 48px; line-height: 1; animation: splash-bob 1.6s ease-in-out infinite; }
      .splash-logo { margin: 0; font: 400 3em/1 "Lilita One", system-ui, sans-serif; transform: rotate(-2deg); }
      .splash-logo span { -webkit-text-stroke: 8px #4a2f1f; paint-order: stroke fill; text-shadow: 0 5px 0 #4a2f1f; }
      @keyframes splash-bob { 50% { transform: translateY(-6px); } }
      @media (prefers-reduced-motion: reduce) { .splash-icon { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status">
        <div class="splash-icon" aria-hidden="true">🌳</div>
        <h1 class="splash-logo" aria-label="PlayGround"><span style="color: #ffd66b">Play</span><span style="color: #8fdc9f">Ground</span></h1>
        <p>Loading…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
