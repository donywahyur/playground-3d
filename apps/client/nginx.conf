server {
  listen 80;
  root /usr/share/nginx/html;

  # Prebuilt .gz files (see Dockerfile); on-the-fly gzip only for anything without one.
  gzip_static on;
  gzip on;
  gzip_comp_level 6;
  gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;

  # Hashed bundles never change; models and textures rarely do.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location ~ ^/(characters|kits|models)/ {
    # .glb isn't in nginx's mime.types; textures and previews keep image/png.
    default_type model/gltf-binary;
    add_header Cache-Control "public, max-age=86400";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
